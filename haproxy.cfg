global
    maxconn 2048

defaults
    mode tcp
    log global
    retries 3
    timeout connect 10s
    timeout client 30s
    timeout server 30s

listen cockroachdb_cluster
    bind :26250
    option tcp-check
    balance roundrobin
    server crdb1 crNode1:26257 check port 26257 inter 1s
    server crdb2 crNode2:26257 check port 26257 inter 1s
    server crdb3 crNode3:26257 check port 26257 inter 1s
    server crdb4 crNode3:26257 check port 26257 inter 1s
    server crdb5 crNode3:26257 check port 26257 inter 1s

listen stats
    bind *:8088
    mode http
    stats enable
    stats uri /stats
    stats realm Haproxy\ Statistics
    stats auth admin:admin


